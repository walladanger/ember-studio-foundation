[package]
name = "ember-studio"
version = "0.1.0"
description = "Ember Studio desktop application"
authors = ["Ember Studio"]
edition = "2021"

[lib]
name = "ember_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
